# Configuración de deploy de selmi.ai (sitio estático).
# El sitio se sirve tal cual desde la raíz del repo (sin build).

[build]
  publish = "."

# ── Redirect www → apex ──────────────────────────────────────────────
# Hace que www.selmi.ai/... redirija 301 a selmi.ai/... (dominio canónico).
# IMPORTANTE: esto solo se aplica una vez que www.selmi.ai APUNTA a Netlify
# (ver pasos en Domain management). El redirect es la mitad de código; la otra
# mitad es el registro DNS, que se configura en el panel de Netlify.
[[redirects]]
  from = "https://www.selmi.ai/*"
  to = "https://selmi.ai/:splat"
  status = 301
  force = true

# /preorden se sirve solo desde preorden/index.html (Netlify resuelve la
# carpeta con index automáticamente). No hace falta redirect para eso.

# ── CORS para assets compartidos (fb-assets) ─────────────────────────
# Permite que estas imagenes se lean via fetch desde otros origenes
# (usado para cargar el logo/portada en plataformas externas).
[[headers]]
  for = "/fb-assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Seguridad básica para todas las páginas públicas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Los nombres de imágenes cambian cuando se actualiza una pieza importante.
# El navegador puede conservarlas y Netlify mantiene una copia duradera en CDN.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"
